<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>平均股价 · ETF轮动监控</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f6f8; color: #333; }
  header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #e5e6eb;
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .meta { font-size: 12px; color: #999; }
  .legend-tip { font-size: 12px; color: #666; }
  .legend-tip b.r { color: #d43f3a; } .legend-tip b.g { color: #2ca02c; }
  #chart { width: 100%; height: 68vh; min-height: 480px; background: #fff; }
  #err { padding: 40px; text-align: center; color: #c00; display: none; }
  .table-wrap { background: #fff; margin-top: 8px; padding: 12px 24px 24px; }
  .table-wrap h2 { font-size: 15px; font-weight: 600; padding: 6px 0 10px; }
  .table-scroll { max-height: 420px; overflow-y: auto; border: 1px solid #e5e6eb; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { position: sticky; top: 0; background: #fafbfc; color: #666; font-weight: 600;
             padding: 8px 10px; border-bottom: 1px solid #e5e6eb; text-align: right; z-index: 1; }
  thead th:first-child, tbody td:first-child { text-align: left; }
  tbody td { padding: 6px 10px; border-bottom: 1px solid #f2f3f5; text-align: right;
             font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #f7f8fa; }
  tr.buy td:first-child { border-left: 3px solid #d43f3a; }
  tr.sell td:first-child { border-left: 3px solid #2ca02c; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 11px; }
  .tag.buy { background: #fde8e7; color: #d43f3a; }
  .tag.sell { background: #e6f4e4; color: #2ca02c; }
  td.neg { color: #2ca02c; } td.pos { color: #d43f3a; }
  .ret-table th, .ret-table td { text-align: center; padding: 5px 6px; }
  .ret-table td.year { font-weight: 600; background: #fafbfc; }
</style>
</head>
<body>
<header>
  <h1>平均股价(880003) · 中证1000ETF / 红利低波ETF 轮动监控</h1>
  <span class="legend-tip">▲<b class="r">买1000（卖红利低波）</b>　▼<b class="g">买红利低波（卖1000）</b>　粉色底纹=持有1000ETF区间</span>
  <span class="meta" id="updated"></span>
</header>
<div id="err">数据加载失败：请先运行 export_json.py 生成 site/data.json，并通过 启动.bat 访问（勿直接双击 html）。</div>
<div id="chart"></div>
<div class="table-wrap">
  <h2>月度 / 年度收益（策略净值，含费用）</h2>
  <div class="table-scroll">
    <table class="ret-table" id="retTable"></table>
  </div>
</div>
<div class="table-wrap">
  <h2>持仓明细（每行 = 一段完整持仓，最新在前；收益已含双边费用）</h2>
  <div style="font-size:12px;color:#999;padding:0 0 8px">累计收益为复利连乘：本行累计 = (1+上行累计) × (1+本行收益) − 1，不是相加</div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr><th>持仓标的</th><th>买入日期</th><th>买入价</th><th>卖出日期</th><th>卖出价</th>
            <th>持有交易日</th><th>收益</th><th>累计收益</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
fetch('data.json?_=' + Date.now()).then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(data => {
  document.getElementById('updated').textContent = '数据更新: ' + data.updated;
  render(data);
  renderReturns(data);
  renderTable(data);
}).catch(e => {
  document.getElementById('err').style.display = 'block';
  console.error(e);
});

// 月度/年度收益表：由净值序列按月末/年末净值环比计算
function renderReturns(data) {
  const D = data.dates, nav = data.nav_strat;
  const monthLast = {}, yearLast = {};
  D.forEach((d, i) => {
    monthLast[d.slice(0, 7)] = nav[i];
    yearLast[d.slice(0, 4)] = nav[i];
  });
  const mRet = {};
  let prev = 1;
  Object.keys(monthLast).sort().forEach(m => {
    mRet[m] = monthLast[m] / prev - 1;
    prev = monthLast[m];
  });
  const years = Object.keys(yearLast).sort();
  const yRet = {};
  prev = 1;
  years.forEach(y => {
    yRet[y] = yearLast[y] / prev - 1;
    prev = yearLast[y];
  });

  const cell = v => v == null
    ? '<td>-</td>'
    : `<td class="${v < 0 ? 'neg' : 'pos'}">${(v * 100).toFixed(2)}%</td>`;
  let html = '<thead><tr><th>年份</th>';
  for (let m = 1; m <= 12; m++) html += `<th>${m}月</th>`;
  html += '<th>全年</th></tr></thead><tbody>';
  for (const y of years) {
    html += `<tr><td class="year">${y}</td>`;
    for (let m = 1; m <= 12; m++) {
      const key = `${y}-${String(m).padStart(2, '0')}`;
      html += cell(key in mRet ? mRet[key] : null);
    }
    html += cell(yRet[y]) + '</tr>';
  }
  html += '</tbody>';
  document.getElementById('retTable').innerHTML = html;
}

function renderTable(data) {
  const fmt = v => (v == null ? '-' : Number(v).toFixed(3));
  const pct = v => (v == null ? '-' : (v * 100).toFixed(2) + '%');
  const cls = v => (v < 0 ? 'neg' : 'pos');
  // 最新在前；每行一段完整持仓，持有中的显示浮动盈亏
  const rows = [...data.legs].reverse().map(l => {
    const tag = l.asset === '1000'
      ? '<span class="tag buy">中证1000ETF</span>'
      : '<span class="tag sell">红利低波ETF</span>';
    return `<tr class="${l.asset === '1000' ? 'buy' : 'sell'}">
      <td>${tag}</td>
      <td>${l.buy_date}</td><td>${fmt(l.buy_price)}</td>
      <td>${l.open ? '<b>持有中</b>' : l.sell_date}</td><td>${fmt(l.sell_price)}</td>
      <td>${l.days}</td>
      <td class="${cls(l.ret)}">${pct(l.ret)}${l.open ? '(浮)' : ''}</td>
      <td class="${cls(l.cum)}">${pct(l.cum)}</td>
    </tr>`;
  }).join('');
  document.getElementById('tbody').innerHTML = rows;
}

function render(data) {
  const chart = echarts.init(document.getElementById('chart'));
  const D = data.dates;

  // 买卖点 markPoint（画在 512100 线上）
  const buyPts = [], sellPts = [];
  for (const t of data.trades) {
    const i = D.indexOf(t.date);
    if (i < 0) continue;
    const pt = { coord: [t.date, data.etf1000[i]], value: t.action === 'buy' ? '买1000' : '买红利低波' };
    (t.action === 'buy' ? buyPts : sellPts).push(pt);
  }

  // 持仓区间 markArea
  const areas = data.hold_spans.map(s => [{ xAxis: s[0] }, { xAxis: s[1] }]);

  const option = {
    animation: false,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      valueFormatter: v => (v == null ? '-' : v)
    },
    legend: {
      data: ['平均股价(左轴)', '中证1000ETF(右轴)', '红利低波ETF(右轴)', 'DIF', 'DEA'],
      top: 6
    },
    axisPointer: { link: [{ xAxisIndex: 'all' }] },
    grid: [
      { left: 60, right: 60, top: 40, height: '52%' },
      { left: 60, right: 60, top: '66%', height: '16%' }
    ],
    xAxis: [
      { type: 'category', data: D, gridIndex: 0, boundaryGap: false },
      { type: 'category', data: D, gridIndex: 1, boundaryGap: false, show: false }
    ],
    yAxis: [
      { type: 'value', gridIndex: 0, name: '平均股价(元)', scale: true,
        splitLine: { lineStyle: { color: '#eee' } } },
      { type: 'value', gridIndex: 0, name: 'ETF(后复权)', scale: true,
        splitLine: { show: false } },
      { type: 'value', gridIndex: 1, name: 'DIF', scale: true,
        splitLine: { lineStyle: { color: '#f5f5f5' } } }
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 70, end: 100 },
      { type: 'slider', xAxisIndex: [0, 1], bottom: 8, height: 22, start: 70, end: 100 }
    ],
    series: [
      {
        name: '平均股价(左轴)', type: 'line', data: data.avg,
        xAxisIndex: 0, yAxisIndex: 0,
        symbol: 'none', lineStyle: { width: 1.4, color: '#222' },
        itemStyle: { color: '#222' },
        markArea: {
          silent: true,
          itemStyle: { color: 'rgba(212,63,58,0.07)' },
          data: areas
        }
      },
      {
        name: '中证1000ETF(右轴)', type: 'line', data: data.etf1000,
        xAxisIndex: 0, yAxisIndex: 1,
        symbol: 'none', lineStyle: { width: 1.4, color: '#d43f3a' },
        itemStyle: { color: '#d43f3a' },
        markPoint: {
          symbol: 'triangle', symbolSize: 11,
          itemStyle: { color: '#d43f3a' },
          label: { show: true, fontSize: 9, color: '#d43f3a', position: 'top' },
          data: buyPts
        }
      },
      {
        name: '红利低波ETF(右轴)', type: 'line', data: data.etfdiv,
        xAxisIndex: 0, yAxisIndex: 1,
        symbol: 'none', lineStyle: { width: 1.4, color: '#2ca02c' },
        itemStyle: { color: '#2ca02c' },
        markPoint: {
          symbol: 'arrow', symbolSize: 11, symbolRotate: 180,
          itemStyle: { color: '#2ca02c' },
          label: { show: true, fontSize: 9, color: '#2ca02c', position: 'bottom' },
          data: sellPts
        }
      },
      {
        name: 'DIF', type: 'line', data: data.dif,
        xAxisIndex: 1, yAxisIndex: 2,
        symbol: 'none', lineStyle: { width: 1, color: '#222' },
        itemStyle: { color: '#222' },
        markLine: { silent: true, symbol: 'none', data: [{ yAxis: 0 }],
                    lineStyle: { color: '#aaa', type: 'dashed', width: 0.8 },
                    label: { show: false } }
      },
      {
        name: 'DEA', type: 'line', data: data.dea,
        xAxisIndex: 1, yAxisIndex: 2,
        symbol: 'none', lineStyle: { width: 1, color: '#5b8ff9' },
        itemStyle: { color: '#5b8ff9' }
      }
    ]
  };
  chart.setOption(option);
  window.addEventListener('resize', () => chart.resize());
}
</script>
</body>
</html>
