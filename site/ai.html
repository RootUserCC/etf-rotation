<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>自选股分组 · 题材分类</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    /* 深色主题（默认） */
    --bg1: #0d1220;
    --bg2: #161d2e;
    --card: #1a2233;
    --card2: #1e2739;
    --row-alt: #1d2638;
    --border: #27324a;
    --border2: #33415e;
    --text: #e8ecf3;
    --muted: #8b95a8;
    --faint: #5b6478;
    --up: #ff6b6b;
    --down: #3ddc97;
    --accent: #4d7cfe;
    --accent2: #7a5cff;
    --amber: #f5a623;
    --accent-soft: rgba(77, 124, 254, 0.14);
    --grad: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  [data-theme="light"] {
    --bg1: #eef1f6;
    --bg2: #f6f8fb;
    --card: #ffffff;
    --card2: #fbfcfe;
    --row-alt: #f7f9fc;
    --border: #e2e6ee;
    --border2: #cfd6e2;
    --text: #1d2733;
    --muted: #667080;
    --faint: #9aa3b3;
    --up: #d43f3a;
    --down: #2ca02c;
    --accent: #3b6df0;
    --accent2: #7a5cff;
    --amber: #e8940a;
    --accent-soft: rgba(59, 109, 240, 0.10);
    --grad: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    --shadow: 0 6px 18px rgba(30, 40, 60, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%) fixed;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 28px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 320px at 12% -4%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      radial-gradient(700px 380px at 92% 0%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 70%);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--card) 82%, transparent);
    backdrop-filter: blur(12px) saturate(1.3);
    border-bottom: 1px solid var(--border);
  }
  .topbar::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--accent2) 70%, transparent);
    opacity: 0.55;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
  .brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border2); background: var(--card2); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 14px; cursor: pointer;
    transition: transform 0.3s, opacity 0.3s;
    text-decoration: none; display: inline-block;
  }
  .btn:hover { border-color: var(--accent); }
  .search {
    border: 1px solid var(--border2); background: var(--card2); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; width: 200px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--faint); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 20px 0; }
  .cat-title {
    font-size: 18px; font-weight: 700; margin: 26px 0 4px;
    display: flex; align-items: center; gap: 10px;
  }
  .cat-title::before {
    content: ''; width: 4px; height: 20px; border-radius: 2px; background: var(--grad);
  }
  .cat-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
  .card h3 {
    font-size: 14.5px; font-weight: 700; padding: 12px 14px;
    background: var(--card2); border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card h3 .cnt { font-size: 11.5px; font-weight: 400; color: var(--faint); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) { background: var(--row-alt); }
  .name { font-weight: 600; white-space: nowrap; }
  .code { color: var(--faint); font-size: 11.5px; font-family: Consolas, monospace; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.5; }
  mark { background: color-mix(in srgb, var(--amber) 40%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* 回测区 */
  .bt-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px;
    animation: fadeUp 0.4s ease both;
  }
  .bt-card h3 {
    font-size: 14.5px; font-weight: 700; padding: 12px 14px;
    background: var(--card2); border-bottom: 1px solid var(--border);
  }
  .bt-best {
    padding: 16px 14px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .bt-cond { font-size: 15px; font-weight: 700; }
  .bt-cond b { color: var(--accent); }
  .bt-pills { display: flex; gap: 10px; flex-wrap: wrap; }
  .bt-pill {
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; white-space: nowrap;
  }
  .bt-pill b { font-weight: 700; }
  .bt-table-wrap { max-height: 420px; overflow-y: auto; }
  .bt-table-wrap table th {
    position: sticky; top: 0; background: var(--card2); font-weight: 600;
    padding: 8px 14px; text-align: left; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .bt-table-wrap table th.num { text-align: right; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--up); }
  .neg { color: var(--down); }

  .foot { max-width: 1100px; margin: 24px auto 0; padding: 0 20px; font-size: 12px; color: var(--faint); line-height: 1.8; }
  /* 今日信号 */
  .sig-alert { border-color: color-mix(in srgb, var(--up) 55%, var(--border)); }
  .sig-alert h3 { color: var(--up); }
  .sig-tag {
    display: inline-block; border-radius: 6px; padding: 3px 8px; margin: 2px 4px 2px 0;
    font-size: 12.5px; background: var(--card2); border: 1px solid var(--border2);
  }
  .sig-tag b { font-weight: 700; }
  .bar-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
  .bar-y { background: #f5a623; } .bar-g { background: #2ca02c; }
  .bar-r { background: #e0483f; } .bar-b { background: #3b6df0; }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    .wrap { padding: 12px 12px 0; }
    .search { width: 130px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" width="38" height="38" viewBox="0 0 40 40">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4d7cfe"/>
          <stop offset="1" stop-color="#7a5cff"/>
        </linearGradient>
      </defs>
      <rect width="40" height="40" rx="10" fill="url(#lg)"/>
      <text x="20" y="26" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">AI</text>
    </svg>
    <div>
      <h1>自选股分组 · 题材分类</h1>
      <div class="sub">来源：自选股分组清单 2026-09-11 整理版 · ETF / PCB / 光纤 / 算力液冷 / 玻纤 / CPO / 存储 / MLCC</div>
    </div>
  </div>
  <div class="topbar-right">
    <input class="search" id="search" placeholder="搜索 名称/代码/题材">
    <a class="btn" href="index.html" title="返回主页">🏠</a>
    <button class="btn" id="themeBtn" title="切换主题">🌓</button>
  </div>
</header>

<div class="wrap" id="sigWrap"></div>

<div class="wrap" id="wrap"></div>

<div class="wrap" id="btWrap"></div>

<div class="foot">
  说明：分组与名单来自《自选股分组清单》（2026-09-11 整理版），同一股票常横跨多个题材，表中仅列其主要标签。
  胜宏科技为港股（02476），不参与 A 股回测。仅为信息归纳，不构成任何投资建议；股市有风险，投资需谨慎。
</div>

<script>
// ===== 数据：大类 → 细分题材 → 股票（来源：自选股分组清单 2026-09-11 整理版） =====
const DATA = [

  { cat: 'PCB（印制电路板）', desc: '含覆铜板、铜箔等上游材料', subs: [

      ['02476', '胜宏科技', '港股：高多层板/HDI（A股对应 300476），不参与 A 股回测'],
      ['603175', '超颖电子', 'PCB'],
    ]},
  ]},
  { cat: '光纤 / 光通信', desc: '光纤光缆为主，上游石英材料列入观察', subs: [
    { sub: '光纤', stocks: [
      ['601869', '长飞光纤', '光纤光缆龙头'],
      ['600522', '中天科技', '光纤光缆 + 海缆'],
      ['600487', '亨通光电', '光纤光缆 + 海缆'],
      ['600498', '烽火通信', '光通信设备 / 光纤光缆'],
      ['603688', '石英股份', '上游材料观察：高纯石英砂 / 石英制品'],
      ['300395', '菲利华', '上游材料观察：石英玻璃材料'],

  { cat: '算力 / 液冷服务', desc: 'AI 服务器整机、温控液冷、算力租赁；芯片标的列入补充', subs: [
    { sub: '算力液冷服务', stocks: [
      ['601138', '工业富联', '英伟达链组装中枢，AI 服务器订单饱满'],
      ['000977', '浪潮信息', '国内 AI 服务器市占率第一'],
      ['603019', '中科曙光', '高性能计算+海光生态，算力服务'],
      ['002837', '英维克', '精密温控龙头，数据中心液冷全链条'],
      ['301018', '申菱环境', '数据中心温控，华为链'],
      ['300857', '协创数据', '算力租赁高标，AI 服务器回收+租赁'],
      ['603629', '利通电子', '算力服务 / 电子制造'],
      ['000815', '美利云', '国资云+数据中心'],
      ['002929', '润建股份', '通信管维+算力租赁'],
      ['688256', '寒武纪', '补充：国产 AI 芯片'],
      ['688041', '海光信息', '补充：国产 CPU / DCU'],
      ['300499', '高澜股份', '补充：液冷温控'],
    ]},
  ]},
  { cat: '玻纤（PCB 上游）', desc: '电子级玻纤布 / 玻纤纱，高速板上游材料', subs: [
    { sub: '玻纤', stocks: [
      ['603256', '宏和科技', '电子级玻纤布'],
      ['301526', '国际复材', '玻纤纱 / 制品'],
      ['605006', '山东玻纤', '玻纤纱'],
      ['600176', '中国巨石', '玻纤龙头'],
    ]},
  ]},
  { cat: 'CPO / 光模块', desc: '共封装光学与高速光模块', subs: [
    { sub: 'CPO', stocks: [
      ['300308', '中际旭创', '全球光模块一哥，800G 主力供应商，1.6T 批量交付'],
      ['300502', '新易盛', '高速光模块龙头，2025 年 4 月低点以来最大涨幅超 10 倍'],
      ['300394', '天孚通信', '光器件平台型龙头，光引擎/CPO 配套'],
      ['002281', '光迅科技', '国内老牌光器件/光模块，央企背景'],
      ['603083', '剑桥科技', '光模块+宽带终端，海外数据中心客户'],
    ]},
  ]},
  { cat: '存储', desc: '存储芯片设计、模组与分销', subs: [
    { sub: '存储', stocks: [
      ['603986', '兆易创新', 'NOR Flash 龙头，利基存储+MCU'],
      ['001309', '德明利', '存储模组 / 主控'],
      ['301308', '江波龙', '存储模组龙头，企业级 SSD 放量'],
      ['688525', '佰维存储', '存储模组'],
      ['688008', '澜起科技', '内存接口芯片'],
      ['300475', '香农芯创', '存储产品分销'],
      ['000021', '深科技', '存储封测 / 模组制造'],
    ]},
  ]},
  { cat: 'MLCC / 被动元件', desc: 'MLCC 整机与上游材料', subs: [
    { sub: 'MLCC', stocks: [
      ['000636', '风华高科', '国产 MLCC 龙头，车规/服务器放量'],
      ['300408', '三环集团', 'MLCC+电子陶瓷龙头，高容 MLCC 扩产'],
      ['300285', '国瓷材料', 'MLCC 上游：陶瓷粉体'],
      ['002859', '洁美科技', 'MLCC 上游：纸质载带/离型膜龙头'],
      ['301566', '达利凯普', 'MLCC'],
      ['603678', '火炬电子', 'MLCC 自产+代理，军工特种电容'],
    ]},
  ]},
];

// ===== 渲染 =====
const wrap = document.getElementById('wrap');
let query = '';

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hl(s) {
  const e = esc(s);
  if (!query) return e;
  const q = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return e.replace(new RegExp('(' + q + ')', 'gi'), '<mark>$1</mark>');
}

function render() {
  const cards = [];
  for (const c of DATA) {
    for (const s of c.subs) {
      const rows = s.stocks.filter(([code, name, note]) =>
        !query || name.includes(query) || code.includes(query) ||
        note.toLowerCase().includes(query.toLowerCase()) || s.sub.includes(query) || c.cat.includes(query));
      if (!rows.length) continue;
      cards.push(`<div class="card"><h3>${hl(s.sub)}<span class="cnt">${rows.length} 只</span></h3>
        <table>${rows.map(([code, name, note]) =>
          `<tr><td class="name">${hl(name)}<div class="code">${code}</div></td>
           <td class="note">${hl(note)}</td></tr>`).join('')}</table></div>`);
    }
  }
  wrap.innerHTML = cards.length
    ? `<div class="grid">${cards.join('')}</div>`
    : '<div class="cat-desc" style="margin-top:30px">无匹配结果</div>';
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.trim();
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
});
render();

// ===== 今日信号（gen_signals.py 导出的 ai_signals.json） =====
const BAR_DOT = { '黄': 'bar-y', '绿': 'bar-g', '红': 'bar-r', '蓝': 'bar-b' };
function sigTag(s) {
  return `<span class="sig-tag"><span class="bar-dot ${BAR_DOT[s.bar] || ''}"></span>
    <b>${esc(s.name)}</b> <span class="code">${s.code}</span> 第${s.yrun}根 ${s.close}</span>`;
}
fetch('ai_signals.json?_=' + Date.now()).then(r => r.ok ? r.json() : null).then(sig => {
  if (!sig) return;
  const dataDate = sig.board.length ? sig.board[0].date : '';
  const buyTags = sig.buy.map(s => sigTag(s)).join('');
  const watchTags = sig.watch.map(s => sigTag(s)).join('');
  const boardRows = sig.board.map(s => {
    const stateTxt = s.state === 'buy' ? '<b class="pos">买点</b>'
      : s.state === 'watch' ? '观察' : '';
    return `<tr><td class="name">${esc(s.name)}<div class="code">${s.code}</div></td>
      <td><span class="bar-dot ${BAR_DOT[s.bar] || ''}"></span>${s.bar}</td>
      <td class="num">${s.yrun || '-'}</td><td class="num">${s.srun || '-'}</td>
      <td class="num">${s.close}</td><td>${stateTxt}</td></tr>`;
  }).join('');
  document.getElementById('sigWrap').innerHTML = `
    <div class="cat-title">今日信号（数据截至 ${esc(dataDate)}）</div>
    <div class="cat-desc">口径：绿转黄起计数，柱不回落（可翻红）计到第 4 根即买点；第 1~3 根为观察。每日随数据更新自动刷新，仅为信号提示，不构成投资建议</div>
    <div class="bt-card sig-alert"><h3>🔔 买点提醒（第 4 根 · 非绿）</h3>
      <div style="padding:12px 14px">${buyTags || '<span class="cat-desc">今日无买点信号</span>'}</div>
    </div>
    <div class="bt-card"><h3>👀 观察名单（第 1~3 根，柱未回落）</h3>
      <div style="padding:12px 14px">${watchTags || '<span class="cat-desc">今日无观察信号</span>'}</div>
    </div>
    <div class="bt-card"><h3>全池柱状态</h3>
      <div class="bt-table-wrap" style="max-height:320px"><table>
        <tr><th>股票</th><th>当根柱</th><th class="num">放宽计数</th><th class="num">严格黄柱</th><th class="num">收盘</th><th>状态</th></tr>
        ${boardRows}</table></div>
    </div>`;
}).catch(() => {});

// ===== 黄柱买入回测结果（ai_yellow_bar.py 导出的 ai_backtest.json） =====
function pct(x, digits = 1) { return x == null ? '-' : (x * 100).toFixed(digits) + '%'; }
function signed(x) {
  if (x == null) return '<td class="num">-</td>';
  const cls = x > 0 ? 'pos' : 'neg';
  return `<td class="num ${cls}">${(x * 100).toFixed(2)}%</td>`;
}
fetch('ai_backtest.json?_=' + Date.now()).then(r => r.ok ? r.json() : null).then(bt => {
  if (!bt) return;
  const b = bt.best;
  const topRows = bt.top.map((r, i) =>
    `<tr><td>${i + 1}</td><td>第${r.n}根黄柱</td><td>${esc(r.filter)}</td><td>${esc(r.sell)}</td>
     <td class="num">${r.trades}</td><td class="num">${pct(r.win)}</td>${signed(r.avg)}
     <td class="num">${r.pl == null ? '-' : r.pl.toFixed(2)}</td>
     <td class="num"><b>${r.pf == null ? '-' : r.pf.toFixed(2)}</b></td></tr>`).join('');
  const stockRows = bt.per_stock.map(s =>
    `<tr><td class="name">${esc(s.name)}<div class="code">${s.code}</div></td>
     <td class="num">${s.trades}</td><td class="num">${pct(s.win)}</td>${signed(s.avg)}
     <td class="num">${s.pl == null ? '-' : s.pl.toFixed(2)}</td></tr>`).join('');
  let redHtml = '';
  if (bt.red) {
    const rb = bt.red.best;
    const scanRows = bt.red.tp_scan.map(s =>
      `<tr><td>${esc(s.sell)}</td><td class="num">${s.trades}</td><td class="num">${pct(s.win)}</td>
       ${signed(s.avg)}<td class="num">${s.pl == null ? '-' : s.pl.toFixed(2)}</td>
       <td class="num"><b>${s.pf == null ? '-' : s.pf.toFixed(2)}</b></td></tr>`).join('');
    const redTopRows = bt.red.top.map((r, i) =>
      `<tr><td>${i + 1}</td><td>第${r.n}根红柱</td><td>${esc(r.filter)}</td><td>${esc(r.sell)}</td>
       <td class="num">${r.trades}</td><td class="num">${pct(r.win)}</td>${signed(r.avg)}
       <td class="num">${r.pl == null ? '-' : r.pl.toFixed(2)}</td>
       <td class="num"><b>${r.pf == null ? '-' : r.pf.toFixed(2)}</b></td></tr>`).join('');
    redHtml = `
    <div class="cat-title">红柱买入回测：第 2 根红柱买 · 止盈多少卖 / 蓝柱卖（同区间）</div>
    <div class="cat-desc">红柱 = MACD 柱零上放大（一段连续红柱中的第 N 根收盘买入）；蓝柱 = 红柱缩头。先给出第 2 根红柱无过滤买入的卖出规则对比，再做全网格搜索</div>
    <div class="bt-card"><h3>第 2 根红柱买入（无过滤）· 卖出规则对比</h3>
      <div class="bt-table-wrap"><table>
        <tr><th>卖出规则</th><th class="num">交易数</th><th class="num">胜率</th><th class="num">平均盈亏</th><th class="num">盈亏比</th><th class="num">收益因子</th></tr>
        ${scanRows}</table></div>
    </div>
    <div class="bt-card"><h3>红柱最优买卖条件（全网格）</h3>
      <div class="bt-best">
        <div class="bt-cond">第 <b>${rb.n}</b> 根红柱买入（${esc(rb.filter)}）→ <b>${esc(rb.sell)}</b>卖出</div>
        <div class="bt-pills">
          <span class="bt-pill">胜率 <b>${pct(rb.win)}</b></span>
          <span class="bt-pill">平均单笔 <b class="${rb.avg > 0 ? 'pos' : 'neg'}">${pct(rb.avg, 2)}</b></span>
          <span class="bt-pill">盈亏比 <b>${rb.pl == null ? '-' : rb.pl.toFixed(2)}</b></span>
          <span class="bt-pill">收益因子 <b>${rb.pf == null ? '-' : rb.pf.toFixed(2)}</b></span>
          <span class="bt-pill">交易数 <b>${rb.trades}</b></span>
        </div>
      </div>
    </div>
    <div class="bt-card"><h3>红柱条件排行榜 Top 10（按收益因子）</h3>
      <div class="bt-table-wrap"><table>
        <tr><th>#</th><th>买入</th><th>过滤</th><th>卖出</th><th class="num">交易数</th><th class="num">胜率</th><th class="num">平均盈亏</th><th class="num">盈亏比</th><th class="num">收益因子</th></tr>
        ${redTopRows}</table></div>
    </div>`;
  }
  document.getElementById('btWrap').innerHTML = `
    <div class="cat-title">黄柱买入回测（${esc(bt.since)} ~ ${esc(bt.updated)}）</div>
    <div class="cat-desc">MACD 柱零下缩头为黄柱；第 N 根黄柱收盘买入。共 ${bt.pool} 只 · 200 组条件网格搜索 · 未计手续费滑点，仅供研究参考</div>
    <div class="bt-card"><h3>最优买卖条件</h3>
      <div class="bt-best">
        <div class="bt-cond">第 <b>${b.n}</b> 根黄柱买入（${esc(b.filter)}）→ <b>${esc(b.sell)}</b>卖出</div>
        <div class="bt-pills">
          <span class="bt-pill">胜率 <b>${pct(b.win)}</b></span>
          <span class="bt-pill">平均单笔 <b class="${b.avg > 0 ? 'pos' : 'neg'}">${pct(b.avg, 2)}</b></span>
          <span class="bt-pill">盈亏比 <b>${b.pl == null ? '-' : b.pl.toFixed(2)}</b></span>
          <span class="bt-pill">收益因子 <b>${b.pf == null ? '-' : b.pf.toFixed(2)}</b></span>
          <span class="bt-pill">交易数 <b>${b.trades}</b></span>
        </div>
      </div>
    </div>
    <div class="bt-card"><h3>条件排行榜 Top 10（按收益因子）</h3>
      <div class="bt-table-wrap"><table>
        <tr><th>#</th><th>买入</th><th>过滤</th><th>卖出</th><th class="num">交易数</th><th class="num">胜率</th><th class="num">平均盈亏</th><th class="num">盈亏比</th><th class="num">收益因子</th></tr>
        ${topRows}</table></div>
    </div>
    <div class="bt-card"><h3>最优条件 · 逐股票明细</h3>
      <div class="bt-table-wrap"><table>
        <tr><th>股票</th><th class="num">交易数</th><th class="num">胜率</th><th class="num">平均盈亏</th><th class="num">盈亏比</th></tr>
        ${stockRows}</table></div>
    </div>${redHtml}`;
}).catch(() => {});
</script>
</body>
</html>
